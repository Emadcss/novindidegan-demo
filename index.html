<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>کیوسک نوبت‌دهی | نوین دیدگان</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/simple-keyboard.css" />
</head>
<body>
  <!-- ========== ENTRY SCREEN ========== -->
  <div id="screen-entry" class="screen active">
    <div class="entry-bg"></div>
    <div class="entry-content">
      <div class="logo-area">
        <div class="logo-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 4.5v15m7.5-7.5h-15" stroke-linecap="round"/>
            <circle cx="12" cy="12" r="9"/>
          </svg>
        </div>
        <h1>نوین دیدگان</h1>
        <p class="subtitle">سامانه کیوسک نوبت‌دهی</p>
      </div>

      <div class="entry-cards">
        <button class="entry-card" data-go="kiosk">
          <div class="entry-icon patient">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
          </div>
          <span class="entry-title">بیمار</span>
          <span class="entry-desc">دریافت نوبت جدید</span>
        </button>

        <button class="entry-card" data-go="admin">
          <div class="entry-icon admin">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
              <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
          </div>
          <span class="entry-title">ادمین</span>
          <span class="entry-desc">ورود به پنل مدیریت</span>
        </button>
      </div>

      <p class="entry-footer">کلینیک فوق‌تخصصی نوین دیدگان</p>
    </div>
  </div>

  <!-- ========== KIOSK FLOW ========== -->
  <div id="screen-kiosk" class="screen">
    <!-- Header -->
    <header class="kiosk-header">
      <div class="header-right">
        <div class="logo-mini">نوین دیدگان</div>
      </div>
      <div class="header-center">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <div class="header-left">
        <div id="live-clock" class="live-clock">--:--</div>
      </div>
    </header>

    <!-- Main content area -->
    <main id="kiosk-content" class="kiosk-content"></main>

    <!-- Bottom navigation -->
    <footer class="kiosk-footer">
      <button id="btn-back" class="btn btn-ghost" disabled>
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg>
        بازگشت
      </button>
      <button id="btn-cancel" class="btn btn-outline-danger">
        انصراف
      </button>
    </footer>
  </div>

  <!-- ========== ADMIN PANEL ========== -->
  <div id="screen-admin" class="screen">
    <aside class="admin-sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">ن</div>
        <div>
          <strong>نوین دیدگان</strong>
          <span>پنل مدیریت</span>
        </div>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-item active" data-panel="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          داشبورد
        </button>
        <button class="nav-item" data-panel="doctors">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          مدیریت پزشکان
        </button>
        <button class="nav-item" data-panel="patients">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          مدیریت بیماران
        </button>
        <button class="nav-item" data-panel="appointments">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          مدیریت نوبت
        </button>
        <button class="nav-item" data-panel="reports">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          گزارش‌گیری
        </button>
        <button class="nav-item" data-panel="admins">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
          مدیریت ادمین‌ها
        </button>
      </nav>
      <button class="sidebar-exit" id="admin-exit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        خروج از پنل
      </button>
    </aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <h2 id="admin-page-title">داشبورد</h2>
        <div class="topbar-left">
          <span class="admin-date" id="admin-date"></span>
          <div class="admin-avatar">ا</div>
        </div>
      </header>
      <div id="admin-content" class="admin-content"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <script src="js/simple-keyboard.js"></script>
  <script src="js/data.js?v=3"></script>
  <script src="js/kiosk.js?v=3"></script>
  <script src="js/admin.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
  <script>
    // data.js loaded check
    if (!window.SAMPLE_APPOINTMENTS) {
      console.error('[novindidegan] CRITICAL: data.js did not load SAMPLE_APPOINTMENTS');
      document.body.insertAdjacentHTML('afterbegin',
        '<div style="position:fixed;inset:0;z-index:99999;background:#be123c;color:#fff;display:flex;align-items:center;justify-content:center;font-family:sans-serif;padding:24px;text-align:center;font-size:1.1rem">خطا: فایل data.js لود نشد. صفحه را Hard Refresh کنید یا سرور استاتیک را از پوشه novindidegan-demo اجرا کنید.</div>');
    } else {
      console.log('[novindidegan] boot OK —', window.SAMPLE_APPOINTMENTS.length, 'appointments');
    }
  </script>
</body>
</html>
